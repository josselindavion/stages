const KEY="msg-anciens-envoyes";
let sent={}; try{sent=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(sent))}catch(e){}}
function copy(text,btn,label){
  const done=()=>{btn.textContent="Copié ✓";btn.classList.add("done");setTimeout(()=>{btn.textContent=label;btn.classList.remove("done")},1500)};
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(text).then(done,()=>fallback(text,done))}else fallback(text,done);
}
function fallback(text,done){const t=document.createElement("textarea");t.value=text;t.style.position="fixed";t.style.opacity="0";document.body.appendChild(t);t.select();try{document.execCommand("copy");done()}catch(e){alert("Copie impossible : sélectionne le texte à la main.")}t.remove()}
function render(){
  const q=document.getElementById("q").value.toLowerCase(), s=document.getElementById("sect").value, c=document.getElementById("canal").value, h=document.getElementById("hide").checked;
  const list=document.getElementById("list"); list.innerHTML=""; let n=0;
  for(const d of DATA){
    if(s&&d.secteur!==s)continue; if(c&&d.canal!==c)continue; if(h&&sent[d.id])continue;
    if(q&&!(d.nom+" "+d.stages+" "+d.id).toLowerCase().includes(q))continue;
    n++;
    const el=document.createElement("div"); el.className="card"+(sent[d.id]?" sent":"");
    el.innerHTML=`<div class="top"><div class="who">${d.id} — ${d.nom}${d.prio?'<span class="tag prio">prioritaire</span>':''}</div>
      <div class="meta">${d.promo} · ${d.canal} · ${d.registre} · ${d.secteur==="finance"?"finance":"défense"}</div></div>
      <div class="stages">${d.stages}</div>
      ${d.sujet?`<div class="row subj"><b>Objet :</b> <span>${d.sujet}</span> <button class="ghost" data-a="subj">Copier l'objet</button></div>`:""}
      <div class="msg"></div>
      <div class="row"><button data-a="msg">Copier le message</button>
      <button class="ghost" data-a="sent">${sent[d.id]?"Envoyé ✓ (annuler)":"Marquer envoyé"}</button></div>`;
    el.querySelector(".msg").textContent=d.message;
    el.querySelector('[data-a="msg"]').onclick=e=>copy(d.message,e.target,"Copier le message");
    const sb=el.querySelector('[data-a="subj"]'); if(sb) sb.onclick=e=>copy(d.sujet,e.target,"Copier l'objet");
    el.querySelector('[data-a="sent"]').onclick=()=>{if(sent[d.id])delete sent[d.id];else sent[d.id]=new Date().toISOString().slice(0,10);save();render()};
    list.appendChild(el);
  }
  const ns=Object.keys(sent).length;
  document.getElementById("count").textContent=`${n} affichés · ${ns} marqués envoyés sur ${DATA.length}`;
}
["q","sect","canal","hide"].forEach(i=>document.getElementById(i).addEventListener("input",render));
render();
